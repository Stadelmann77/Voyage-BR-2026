<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiements — Voyage Brésil 2026</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <script type="module" src="assets/i18n.js"></script>
  <style>
    .expense-row td { vertical-align: middle; }
    .beneficiary-chips { display: flex; flex-wrap: wrap; gap: .25rem; }
    .chip {
      display: inline-block; padding: .15rem .5rem; border-radius: 999px;
      font-size: .75rem; font-weight: 600;
      background: var(--primary-light, #dbeafe); color: var(--primary, #1d4ed8);
    }
    .chip.person { background: #dcfce7; color: #166534; }
    .chip.cat-flight   { background: #eff6ff; color: #1d4ed8; }
    .chip.cat-lodging  { background: #f0fdf4; color: #166534; }
    .chip.cat-transport{ background: #fefce8; color: #854d0e; }
    .rate-source { font-size: .8rem; color: var(--text-light); margin-left: .4rem; }
    .payment-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .summary-card {
      border: 1px solid var(--border, #e5e7eb);
      border-radius: .75rem;
      padding: 1rem;
      background: #fff;
    }
    .summary-card h3 { margin: 0 0 .5rem; font-size: 1rem; }
    .summary-card .amount-chf { font-size: 1.2rem; font-weight: 700; color: var(--primary); }
    .summary-card .amount-brl { font-size: .85rem; color: var(--text-light); }
    .summary-card .summary-row { padding: .25rem 0; }
    .summary-card .summary-row:not(:last-child) { border-bottom: 1px solid var(--border, #e5e7eb); margin-bottom: .25rem; padding-bottom: .25rem; }
    .summary-card .summary-label { font-size: .72rem; color: var(--text-light); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; display: block; }
    .summary-card .amount-primary { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
    .summary-card .amount-secondary { font-size: .82rem; color: var(--text-light); }
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="index.html"><span>🇧🇷</span> Voyage Brésil 2026</a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav.home">🏠 Accueil</a>
      <a href="flights.html" data-i18n="nav.flights">✈️ Vols</a>
      <a href="lodgings.html" data-i18n="nav.lodgings">🏨 Hébergements</a>
      <a href="transport.html" data-i18n="nav.transport">🚗 Transport</a>
      <a href="payments.html" data-i18n="nav.payments">💰 Paiements</a>
      <a href="contacts.html" data-i18n="nav.contacts">📞 Contacts</a>
      <a href="checklist.html" data-i18n="nav.checklist">✅ Checklist</a>
      <a href="attractions-restaurants.html" data-i18n="nav.attractions">🗺️ Attraits &amp; Restos</a>
    </div>
    <div class="nav-spacer"></div>
    <div class="lang-toggle">
      <button class="lang-btn" data-lang="fr" aria-pressed="true">FR</button>
      <button class="lang-btn" data-lang="pt-BR" aria-pressed="false">PT</button>
    </div>
    <a class="nav-admin-link" href="admin.html" data-i18n="nav.admin">⚙️ Admin</a>
  </nav>

  <main>
    <div class="page-header">
      <h1 data-i18n="page.payments.title">💰 Paiements par personne</h1>
      <p data-i18n="page.payments.subtitle">Résumé des coûts et statuts de paiement pour chaque voyageur.</p>
    </div>

    <div class="alert alert-info" id="rate-info">
      <span data-i18n="payments.rate.prefix">💱 Taux de change: 1 CHF =</span>
      <strong id="rate-value">…</strong>
      <span data-i18n="payments.rate.suffix">BRL</span>
      <span class="rate-source" id="rate-source"></span>
    </div>

    <div id="payments-container">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>

    <!-- Documents section (payment-related documents) -->
    <div id="documents-section" style="margin-top:1.5rem"></div>
  </main>

  <footer>
    <p><span data-i18n="footer.text">Voyage Brésil 2026 · Données gérées via</span> JSON</p>
  </footer>

  <script type="module">
    import { fetchExpenses, fetchPeople, showLoading, escHtml, statusBadge, parseBrl } from './assets/public.js';
    import { t } from './assets/i18n.js';

    // ── Exchange rate fetch ─────────────────────────────────────
    async function fetchRate(fallback) {
      const apis = [
        {
          url: 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/chf.json',
          extract: d => d && d.chf && d.chf.brl,
          source: 'jsdelivr/fawazahmed0',
        },
        {
          url: 'https://api.exchangerate-api.com/v4/latest/CHF',
          extract: d => d && d.rates && d.rates.BRL,
          source: 'exchangerate-api.com',
        },
      ];

      for (const api of apis) {
        try {
          const res = await fetch(api.url);
          if (!res.ok) continue;
          const data = await res.json();
          const rate = api.extract(data);
          if (rate && rate > 0) return { rate: Number(rate.toFixed(4)), source: api.source };
        } catch (_) { /* try next */ }
      }
      return { rate: fallback, source: 'fallback' };
    }

    // ── Weighted split ──────────────────────────────────────────
    const ALL_FOUR_NAMES = ['Claudio', 'Claudeane', 'Lucileide', 'Jhemerson'];

    // Rules:
    //   - All 4 beneficiaries + flight → equal split (weight = 1 each)
    //   - All 4 beneficiaries + non-flight → Claudio=1.25, Claudeane=1.25,
    //       Lucileide=1.0, Jhemerson=0.5
    //   - Subset (not all 4) → equal split regardless of category
    function getEffectiveWeight(name, isAllFour, category) {
      if (!isAllFour || category === 'flight') return 1.0;
      if (name === 'Claudio' || name === 'Claudeane') return 1.25;
      if (name === 'Jhemerson') return 0.5;
      return 1.0; // Lucileide
    }

    function computeSplit(expense, peopleMap) {
      const beneficiaries = expense.beneficiaries || [];
      const category = expense.category || '';

      // Special case: exactly all 4 travellers → apply weighted split
      const bSet = new Set(beneficiaries);
      const isAllFour = bSet.size === ALL_FOUR_NAMES.length &&
        ALL_FOUR_NAMES.every(n => bSet.has(n));

      const totalWeight = beneficiaries.reduce(
        (s, name) => s + getEffectiveWeight(name, isAllFour, category), 0);
      if (totalWeight === 0) return {};

      const amtBrl = parseBrl(expense.amount_brl);
      const shares = {};
      beneficiaries.forEach(name => {
        const w = getEffectiveWeight(name, isAllFour, category);
        shares[name] = {
          chf: expense.amount_chf ? (expense.amount_chf * w / totalWeight) : 0,
          brl: amtBrl ? (amtBrl * w / totalWeight) : 0,
        };
      });
      return shares;
    }

    // Returns the fraction [0,1] of an expense that has already been paid.
    // Priority: ✅ status → 1; paid_ratio wins over paid_amount; else derive
    // from paid_amount/amount; else 0.
    function getEffectivePaidRatio(exp) {
      if ((exp.status || '').startsWith('✅')) return 1;
      if (exp.paid_ratio != null) return Math.min(1, Math.max(0, Number(exp.paid_ratio)));
      if (exp.paid_amount != null) {
        const amount = parseBrl(exp.amount_brl) || exp.amount_chf || 0;
        if (amount > 0) return Math.min(1, Math.max(0, Number(exp.paid_amount) / amount));
      }
      return 0;
    }

    // ── Main load ───────────────────────────────────────────────
    async function loadPayments() {
      const container = document.getElementById('payments-container');
      showLoading(container);

      try {
        const paramsRes = await fetch('data/parameters.json').then(r => r.json());
        const fallbackRate = parseFloat(paramsRes.find(p => p.key === 'chf_brl_rate')?.value || '6.7');

        const [{ rate, source }, expenses, people] = await Promise.all([
          fetchRate(fallbackRate),
          fetchExpenses(),
          fetchPeople(),
        ]);

        document.getElementById('rate-value').textContent = rate;
        const srcEl = document.getElementById('rate-source');
        if (source === 'fallback') {
          srcEl.textContent = `(${t('payments.rate.fallback')})`;
        } else {
          srcEl.textContent = `(${t('payments.rate.live')}: ${source})`;
        }

        // Build people map for quick lookup
        const peopleMap = {};
        people.forEach(p => { peopleMap[p.name] = p; });

        // Accumulate per-person totals
        const personTotals = {};
        people.forEach(p => { personTotals[p.name] = { chf: 0, brl: 0 }; });

        const expenseRows = expenses.map(exp => {
          const shares = computeSplit(exp, peopleMap);
          Object.entries(shares).forEach(([name, s]) => {
            if (personTotals[name]) {
              personTotals[name].chf += s.chf;
              personTotals[name].brl += s.brl;
            }
          });
          return { exp, shares };
        });

        // Accumulate per-person paid totals — scale each share by the effective
        // paid ratio: 1 for fully paid (✅), paid_ratio if set, derived from
        // paid_amount if available, otherwise 0.
        const paidTotals = {};
        people.forEach(p => { paidTotals[p.name] = { chf: 0, brl: 0 }; });
        expenseRows.forEach(({ exp, shares }) => {
          const ratio = getEffectivePaidRatio(exp);
          if (ratio > 0) {
            Object.entries(shares).forEach(([name, s]) => {
              if (paidTotals[name]) {
                paidTotals[name].chf += s.chf * ratio;
                paidTotals[name].brl += s.brl * ratio;
              }
            });
          }
        });

        let grandChf = 0, grandBrl = 0;
        expenses.forEach(e => {
          grandChf += e.amount_chf || 0;
          grandBrl += parseBrl(e.amount_brl) || 0;
        });

        let html = '';

        // ── Per-person summary cards ─────────────────────────
        const BRL_ONLY_PEOPLE = new Set(['Lucileide', 'Jhemerson']);

        // Format helpers — CHF rounded to nearest 0.05 (5 centimes) for display.
        // Multiply by 20 (= 1/0.05), round, divide back: e.g. 12.37 → 12.35.
        const roundChf = v => Math.round((isFinite(v) ? v : 0) * 20) / 20;
        const fmtChf = v => roundChf(v).toLocaleString('fr-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '\u00a0CHF';
        const fmtBrl = v => 'R$\u00a0' + (isFinite(v) ? v : 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        // BRL secondary lines: CHF×convRate (converted) + native BRL received
        const brlSecondary = (chfAmt, brlAmt, convRate) => {
          const converted = chfAmt * convRate;
          const showConverted = converted > 0.005;
          const showReceipt  = brlAmt > 0.005;
          if (!showConverted && !showReceipt) return '';
          let out = '';
          if (showConverted) {
            out += `<span class="amount-secondary" style="display:block">${t('payments.brl.converted')}: ${fmtBrl(converted)}</span>`;
          }
          if (showReceipt) {
            out += `<span class="amount-secondary" style="display:block">${t('payments.brl.receipt')}: ${fmtBrl(brlAmt)}</span>`;
          }
          if (showConverted && showReceipt) {
            out += `<span class="amount-secondary" style="display:block">${t('payments.brl.total')}: ${fmtBrl(converted + brlAmt)}</span>`;
          }
          return out;
        };

        html += `<h2 style="margin-bottom:.75rem">👥 ${t('payments.perPerson')}</h2>
          <div class="payment-summary-grid">`;
        people.forEach(p => {
          const tot  = personTotals[p.name] || { chf: 0, brl: 0 };
          const paid = paidTotals[p.name]   || { chf: 0, brl: 0 };
          const remainChf = tot.chf - paid.chf;
          const remainBrl = tot.brl - paid.brl;

          if (BRL_ONLY_PEOPLE.has(p.name)) {
            // All values in BRL only; convert any CHF portion to BRL.
            // "total" uses live rate; "paid" uses frozen fallback rate (taux figé).
            // Since these people have paid.chf = 0 in the current data, the
            // remainingBrl = totalBrl(live) - paidBrl(frozen) is numerically equivalent
            // to remainingBrl = totalBrl - paidBrl(live), but we keep frozen for "paid"
            // to be consistent with the rule applied to Claudio/Claudeane.
            const totalBrl  = tot.brl  + tot.chf  * rate;
            const paidBrl   = paid.brl + paid.chf  * fallbackRate;
            const remainingBrl = (tot.brl - paid.brl) + (tot.chf - paid.chf) * rate;
            html += `<div class="summary-card">
              <h3>👤 ${escHtml(p.name)}</h3>
              <div class="summary-row">
                <span class="summary-label">${t('payments.due')}</span>
                <span class="amount-primary">${fmtBrl(totalBrl)}</span>
              </div>
              <div class="summary-row">
                <span class="summary-label">${t('payments.paid')}</span>
                <span class="amount-primary">${fmtBrl(paidBrl)}</span>
              </div>
              <div class="summary-row">
                <span class="summary-label">${t('payments.remaining')}</span>
                <span class="amount-primary">${fmtBrl(remainingBrl)}</span>
              </div>
            </div>`;
          } else {
            // CHF primary + BRL secondary
            // "due" and "remaining" use current live rate; "paid" uses frozen fallback rate
            html += `<div class="summary-card">
              <h3>👤 ${escHtml(p.name)} <small style="font-weight:400;opacity:.7">×${p.weight}</small></h3>
              <div class="summary-row">
                <span class="summary-label">${t('payments.due')}</span>
                <span class="amount-primary">${fmtChf(tot.chf)}</span>${brlSecondary(tot.chf, tot.brl, rate)}
              </div>
              <div class="summary-row">
                <span class="summary-label">${t('payments.paid')}</span>
                <span class="amount-primary">${fmtChf(paid.chf)}</span>${brlSecondary(paid.chf, paid.brl, fallbackRate)}
              </div>
              <div class="summary-row">
                <span class="summary-label">${t('payments.remaining')}</span>
                <span class="amount-primary">${fmtChf(remainChf)}</span>${brlSecondary(remainChf, remainBrl, rate)}
              </div>
            </div>`;
          }
        });
        html += `</div>`;

        // ── Expense detail table ─────────────────────────────
        html += `<div class="card" style="padding:0;overflow:hidden;margin-bottom:1.5rem">
          <div class="payment-person-header">${t('payments.expenseTable')}</div>
          <div class="table-wrap"><table>
            <thead><tr>
              <th>${t('th.payment.category')}</th>
              <th>${t('th.payment.detail')}</th>
              <th>${t('th.payment.chf')}</th>
              <th>${t('th.payment.brl')}</th>
              <th>${t('payments.beneficiaries')}</th>
              <th>${t('th.payment.status')}</th>
            </tr></thead>
            <tbody>`;

        const catEmoji = { flight: '✈️', lodging: '🏨', transport: '🚗' };

        expenseRows.forEach(({ exp, shares }) => {
          const cat = exp.category || 'other';
          const label = catEmoji[cat] ? catEmoji[cat] + ' ' + cat : cat;
          html += `<tr class="expense-row">
            <td><span class="chip cat-${escHtml(cat)}">${escHtml(label)}</span></td>
            <td title="${escHtml(exp.notes || '')}">${escHtml(exp.label)}</td>
            <td>${exp.amount_chf ? Number(exp.amount_chf).toLocaleString('fr-CH', { maximumFractionDigits: 2 }) : '—'}</td>
            <td>${exp.amount_brl ? 'R$\u00a0' + Number(exp.amount_brl).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) : '—'}</td>
            <td><div class="beneficiary-chips">
              ${(exp.beneficiaries || []).map(b => {
                const s = shares[b] || {};
                const parts = [];
                if (s.chf > 0.01) parts.push(s.chf.toLocaleString('fr-CH', { maximumFractionDigits: 2 }) + ' CHF');
                if (s.brl > 0.01) parts.push('R$' + s.brl.toLocaleString('pt-BR', { maximumFractionDigits: 2 }));
                const title = parts.length ? parts.join(' / ') : '';
                return `<span class="chip person" title="${escHtml(title)}">${escHtml(b)}</span>`;
              }).join('')}
            </div></td>
            <td>${(() => {
              const ratio = getEffectivePaidRatio(exp);
              const badge = statusBadge(exp.status || '—');
              if (ratio > 0 && ratio < 1) {
                const pct = Math.round(ratio * 100);
                return badge + ` <span class="status status-warn" style="font-size:.75em">${pct}%\u00a0payé</span>`;
              }
              return badge;
            })()}</td>
          </tr>`;
        });

        html += `</tbody></table></div></div>`;

        // ── Grand total ──────────────────────────────────────
        const brlInChf = grandBrl / rate;
        const grandTotal = grandChf + brlInChf;

        html += `<div class="card" style="border:2px solid var(--primary)">
          <h2>💰 ${t('payments.grandTotal')}</h2>
          <div class="table-wrap"><table><tbody>
            <tr><td style="font-weight:600">${t('payments.totalChf')}</td>
                <td><strong>${grandChf.toLocaleString('fr-CH', { maximumFractionDigits: 2 })} CHF</strong></td></tr>
            <tr><td style="font-weight:600">${t('payments.totalBrl')}</td>
                <td>R$ ${grandBrl.toLocaleString('pt-BR', { maximumFractionDigits: 2 })}</td></tr>
            <tr><td style="font-weight:600">${t('payments.brlToChf.prefix')} ${rate} ${t('payments.brlToChf.suffix')}</td>
                <td>${brlInChf.toLocaleString('fr-CH', { maximumFractionDigits: 2 })} CHF</td></tr>
            <tr style="background:#EFF6FF">
                <td style="font-weight:700;color:var(--primary)">${t('payments.grandTotal')}</td>
                <td style="font-weight:700;font-size:1.1rem;color:var(--primary)">${grandTotal.toLocaleString('fr-CH', { maximumFractionDigits: 2 })} CHF</td></tr>
          </tbody></table></div>
          <p style="font-size:.8rem;color:var(--text-light);margin-top:.75rem">${t('payments.weightNote')}</p>
        </div>`;

        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">⚠️ ${escHtml(err.message)}</div>`;
      }
    }

    loadPayments();

    document.addEventListener('langchange', () => {
      const c = document.getElementById('payments-container');
      if (c && !c.querySelector('.alert')) loadPayments();
    });
  </script>
  <script type="module">
    import { fetchContent, escHtml } from './assets/public.js';
    import { lang } from './assets/i18n.js';
    import { t } from './assets/i18n.js';

    function renderDocumentsSection(container, items) {
      if (!items || items.length === 0) return;
      let html = `<div class="card"><h2>${escHtml(t('section.documents'))}</h2>`;
      items.forEach(item => {
        html += `<div style="margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border,#e5e7eb)">
          <h3 style="margin:0 0 .35rem">${escHtml(item.title)}</h3>`;
        if (item.date) html += `<p style="font-size:.8rem;color:var(--text-light)">${escHtml(t('content.date'))}: ${escHtml(item.date)}</p>`;
        if (item.description) html += `<p style="white-space:pre-line">${escHtml(item.description)}</p>`;
        if (item.links && item.links.length) {
          html += `<p style="font-weight:600;margin-bottom:.25rem">${escHtml(t('content.links'))}</p><ul style="margin:0;padding-left:1.2rem">`;
          item.links.forEach(l => { html += `<li><a href="${escHtml(l.url)}" target="_blank" rel="noopener">${escHtml(l.label)}</a></li>`; });
          html += '</ul>';
        }
        if (item.attachments && item.attachments.length) {
          html += `<p style="font-weight:600;margin:.5rem 0 .25rem">${escHtml(t('content.attachments'))}</p><div style="display:flex;flex-wrap:wrap;gap:.5rem">`;
          item.attachments.forEach(a => {
            const icon = a.type === 'pdf' ? '📄' : '🖼️';
            html += `<a href="${escHtml(a.url)}" target="_blank" rel="noopener" class="btn btn-outline btn-sm">${icon} ${escHtml(a.label)}</a>`;
          });
          html += '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
      container.innerHTML = html;
    }

    async function loadDocuments() {
      const currentLang = lang;
      try {
        const docs = await fetchContent(currentLang, 'documents');
        renderDocumentsSection(document.getElementById('documents-section'), docs);
      } catch (_) { /* optional section */ }
    }

    loadDocuments();
    document.addEventListener('langchange', loadDocuments);
  </script>
</body>
</html>
