<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiements — Voyage Brésil 2026</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <script type="module" src="assets/i18n.js"></script>
</head>
<body>
  <nav>
    <a class="nav-brand" href="index.html"><span>🇧🇷</span> Voyage Brésil 2026</a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav.home">🏠 Accueil</a>
      <a href="flights.html" data-i18n="nav.flights">✈️ Vols</a>
      <a href="lodgings.html" data-i18n="nav.lodgings">🏨 Hébergements</a>
      <a href="transport.html" data-i18n="nav.transport">🚗 Transport</a>
      <a href="payments.html" data-i18n="nav.payments">💰 Paiements</a>
      <a href="contacts.html" data-i18n="nav.contacts">📞 Contacts</a>
      <a href="checklist.html" data-i18n="nav.checklist">✅ Checklist</a>
    </div>
    <div class="nav-spacer"></div>
    <div class="lang-toggle">
      <button class="lang-btn" data-lang="fr" aria-pressed="true">FR</button>
      <button class="lang-btn" data-lang="pt-BR" aria-pressed="false">PT</button>
    </div>
    <a class="nav-admin-link" href="admin.html" data-i18n="nav.admin">⚙️ Admin</a>
  </nav>

  <main>
    <div class="page-header">
      <h1 data-i18n="page.payments.title">💰 Paiements par personne</h1>
      <p data-i18n="page.payments.subtitle">Résumé des coûts et statuts de paiement pour chaque voyageur.</p>
    </div>

    <div class="alert alert-info" id="rate-info">
      <span data-i18n="payments.rate.prefix">💱 Taux de change: 1 CHF =</span> <span id="rate-value">6.7</span> <span data-i18n="payments.rate.suffix">BRL</span>
    </div>

    <div id="payments-container">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>
  </main>

  <footer>
    <p><span data-i18n="footer.text">Voyage Brésil 2026 · Données gérées via</span> <a href="https://supabase.com" target="_blank" style="color:rgba(255,255,255,.7)">Supabase</a></p>
  </footer>

  <script src="assets/config.js" onerror="window.__configLoadError=true"></script>
  <script type="module">
    import { fetchPayments, fetchTravellers, showError, showLoading, escHtml, statusBadge } from './assets/public.js';
    import { supabase } from './assets/supabaseClient.js';
    import { t } from './assets/i18n.js';

    async function loadPayments() {
      const container = document.getElementById('payments-container');
      showLoading(container);

      try {
        const [payments, travellers, { data: params }] = await Promise.all([
          fetchPayments(),
          fetchTravellers(),
          supabase.from('parameters').select('key,value'),
        ]);

        // Update exchange rate display
        const rate = params?.find(p => p.key === 'chf_brl_rate')?.value;
        if (rate) document.getElementById('rate-value').textContent = rate;

        renderPayments(payments, travellers, container);
      } catch (err) {
        showError(container, err.message, err.stack);
      }
    }

    function renderPayments(payments, travellers, container) {
      if (!payments || !travellers) {
        container.innerHTML = `<div class="alert alert-info">${t('payments.noData')}</div>`;
        return;
      }

      // Group payments by traveller
      const byTraveller = {};
      payments.forEach(p => {
        const tid = p.traveller_id;
        if (!byTraveller[tid]) byTraveller[tid] = [];
        byTraveller[tid].push(p);
      });

      let html = '';

      travellers.forEach(tv => {
        const tPayments = byTraveller[tv.id] || [];
        if (tPayments.length === 0) return;

        const totalChf = tPayments.reduce((s, p) => s + (p.price_chf || 0), 0);
        const totalBrl = tPayments.reduce((s, p) => s + (p.price_brl || 0), 0);
        const paidChf = tPayments.filter(p => p.paid?.includes('✅')).reduce((s, p) => s + (p.price_chf || 0), 0);

        html += `
          <div class="card" style="padding:0;overflow:hidden;margin-bottom:1.5rem">
            <div class="payment-person-header">
              <span>👤 ${escHtml(tv.name)} <span style="font-weight:400;opacity:.8">— ${escHtml(tv.role)}</span></span>
              <span style="font-size:.85rem">
                ${t('payments.total.label')} ${totalChf > 0 ? '<strong>' + totalChf.toLocaleString('fr-CH') + ' CHF</strong>' : ''}
                ${totalBrl > 0 ? ' + R$ ' + totalBrl.toLocaleString('pt-BR') : ''}
              </span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>${t('th.payment.category')}</th>
                    <th>${t('th.payment.detail')}</th>
                    <th>${t('th.payment.chf')}</th>
                    <th>${t('th.payment.brl')}</th>
                    <th>${t('th.payment.status')}</th>
                    <th>${t('th.payment.notes')}</th>
                  </tr>
                </thead>
                <tbody>
                  ${tPayments.map(p => `<tr>
                    <td><strong>${escHtml(p.category)}</strong></td>
                    <td>${escHtml(p.detail)}</td>
                    <td>${p.price_chf != null ? Number(p.price_chf).toLocaleString('fr-CH') : '—'}</td>
                    <td>${p.price_brl != null ? 'R$ ' + Number(p.price_brl).toLocaleString('pt-BR') : '—'}</td>
                    <td>${statusBadge(p.paid || '—')}</td>
                    <td><small style="color:var(--text-light)">${escHtml(p.notes || '')}</small></td>
                  </tr>`).join('')}
                  <tr class="payment-total-row">
                    <td colspan="2"><strong>${t('payments.subtotal')} ${escHtml(tv.name).toUpperCase()}</strong></td>
                    <td><strong>${totalChf > 0 ? totalChf.toLocaleString('fr-CH') + ' CHF' : '—'}</strong></td>
                    <td><strong>${totalBrl > 0 ? 'R$ ' + totalBrl.toLocaleString('pt-BR') : '—'}</strong></td>
                    <td colspan="2"><small style="color:var(--success)">${t('payments.paidChf')} ${paidChf.toLocaleString('fr-CH')}</small></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>`;
      });

      // Grand total
      const grandTotalChf = payments.reduce((s, p) => s + (p.price_chf || 0), 0);
      const grandTotalBrl = payments.reduce((s, p) => s + (p.price_brl || 0), 0);
      const rateEl = document.getElementById('rate-value');
      const rate = parseFloat(rateEl?.textContent || '6.7');
      const brlInChf = grandTotalBrl / rate;
      const grandTotal = grandTotalChf + brlInChf;

      html += `
        <div class="card" style="border:2px solid var(--primary)">
          <h2>${t('payments.grandTotal')}</h2>
          <div class="table-wrap">
            <table>
              <tbody>
                <tr>
                  <td style="font-weight:600">${t('payments.totalChf')}</td>
                  <td><strong>${grandTotalChf.toLocaleString('fr-CH')} CHF</strong></td>
                </tr>
                <tr>
                  <td style="font-weight:600">${t('payments.totalBrl')}</td>
                  <td>R$ ${grandTotalBrl.toLocaleString('pt-BR')}</td>
                </tr>
                <tr>
                  <td style="font-weight:600">${t('payments.brlToChf.prefix')} ${rate} ${t('payments.brlToChf.suffix')}</td>
                  <td>${brlInChf.toLocaleString('fr-CH', { maximumFractionDigits: 2 })} CHF</td>
                </tr>
                <tr style="background:#EFF6FF">
                  <td style="font-weight:700;color:var(--primary)">${t('payments.grandTotal')}</td>
                  <td style="font-weight:700;font-size:1.1rem;color:var(--primary)">${grandTotal.toLocaleString('fr-CH', { maximumFractionDigits: 2 })} CHF</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>`;

      container.innerHTML = html;
    }

    loadPayments();

    document.addEventListener('langchange', () => {
      const c = document.getElementById('payments-container');
      if (c && !c.querySelector('.alert')) loadPayments();
    });
  </script>
</body>
</html>
