<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiements — Voyage Brésil 2026</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <script type="module" src="assets/i18n.js"></script>
</head>
<body>
  <nav>
    <a class="nav-brand" href="index.html"><span>🇧🇷</span> Voyage Brésil 2026</a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav.home">🏠 Accueil</a>
      <a href="flights.html" data-i18n="nav.flights">✈️ Vols</a>
      <a href="lodgings.html" data-i18n="nav.lodgings">🏨 Hébergements</a>
      <a href="transport.html" data-i18n="nav.transport">🚗 Transport</a>
      <a href="payments.html" data-i18n="nav.payments">💰 Paiements</a>
      <a href="contacts.html" data-i18n="nav.contacts">📞 Contacts</a>
      <a href="checklist.html" data-i18n="nav.checklist">✅ Checklist</a>
    </div>
    <div class="nav-spacer"></div>
    <div class="lang-toggle">
      <button class="lang-btn" data-lang="fr" aria-pressed="true">FR</button>
      <button class="lang-btn" data-lang="pt-BR" aria-pressed="false">PT</button>
    </div>
    <a class="nav-admin-link" href="admin.html" data-i18n="nav.admin">⚙️ Admin</a>
  </nav>

  <main>
    <div class="page-header">
      <h1 data-i18n="page.payments.title">💰 Paiements par personne</h1>
      <p data-i18n="page.payments.subtitle">Résumé des coûts et statuts de paiement pour chaque voyageur.</p>
    </div>

    <div class="alert alert-info" id="rate-info">
      <span data-i18n="payments.rate.prefix">💱 Taux de change: 1 CHF =</span> <span id="rate-value">6.7</span> <span data-i18n="payments.rate.suffix">BRL</span>
    </div>

    <div id="payments-container">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>
  </main>

  <footer>
    <p><span data-i18n="footer.text">Voyage Brésil 2026 · Données gérées via</span> JSON</p>
  </footer>

  <script type="module">
    import { fetchFlights, fetchLodgings, fetchTransport, fetchTravellers, showLoading, escHtml, fmtAmt, statusBadge } from './assets/public.js';
    import { t } from './assets/i18n.js';

    async function loadPayments() {
      const container = document.getElementById('payments-container');
      showLoading(container);

      try {
        const [flights, lodgings, transport, travellers, paramsRes] = await Promise.all([
          fetchFlights(),
          fetchLodgings(),
          fetchTransport(),
          fetchTravellers(),
          fetch('data/parameters.json').then(r => r.json()),
        ]);

        const rate = parseFloat(paramsRes.find(p => p.key === 'chf_brl_rate')?.value || '6.7');
        document.getElementById('rate-value').textContent = rate;

        // Build payment summary from flights, lodgings, transport
        let grandTotalChf = 0, grandTotalBrl = 0;
        let html = '';

        travellers.forEach(tv => {
          const name = tv.name;
          const lines = [];

          // Flights for this traveller
          flights.filter(f => f.passengers.includes(name)).forEach(f => {
            lines.push({ cat: 'Vol', detail: f.route, chf: f.price_chf, brl: f.price_brl, status: f.payment_status });
          });

          // Lodgings for this traveller
          lodgings.filter(l => l.travellers_desc.includes(name)).forEach(l => {
            lines.push({ cat: 'Hébergement', detail: `${l.establishment} (${l.city})`, chf: l.price_chf, brl: l.price_brl, status: l.prepayment });
          });

          // Transport
          transport.filter(t => t.driver.includes(name)).forEach(t => {
            lines.push({ cat: 'Transport', detail: `${t.vehicle} — ${t.agency}`, chf: null, brl: t.price_brl, status: t.payment_status });
          });

          if (lines.length === 0) return;

          const totalChf = lines.reduce((s, l) => s + (l.chf || 0), 0);
          const totalBrl = lines.reduce((s, l) => s + (l.brl || 0), 0);
          grandTotalChf += totalChf;
          grandTotalBrl += totalBrl;

          html += `
            <div class="card" style="padding:0;overflow:hidden;margin-bottom:1.5rem">
              <div class="payment-person-header">
                <span>👤 ${escHtml(name)} <span style="font-weight:400;opacity:.8">— ${escHtml(tv.role)}</span></span>
              </div>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Catégorie</th><th>Détail</th><th>CHF</th><th>BRL</th><th>Statut</th></tr></thead>
                  <tbody>
                    ${lines.map(l => `<tr>
                      <td><strong>${escHtml(l.cat)}</strong></td>
                      <td>${escHtml(l.detail)}</td>
                      <td>${l.chf ? Number(l.chf).toLocaleString('fr-CH') : '—'}</td>
                      <td>${l.brl ? 'R$ ' + Number(l.brl).toLocaleString('pt-BR') : '—'}</td>
                      <td>${statusBadge(l.status || '—')}</td>
                    </tr>`).join('')}
                    <tr class="payment-total-row">
                      <td colspan="2"><strong>TOTAL ${escHtml(name).toUpperCase()}</strong></td>
                      <td><strong>${totalChf ? totalChf.toLocaleString('fr-CH') + ' CHF' : '—'}</strong></td>
                      <td><strong>${totalBrl ? 'R$ ' + totalBrl.toLocaleString('pt-BR') : '—'}</strong></td>
                      <td></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>`;
        });

        // Grand total
        const brlInChf = grandTotalBrl / rate;
        const grandTotal = grandTotalChf + brlInChf;

        html += `
          <div class="card" style="border:2px solid var(--primary)">
            <h2>💰 Total général</h2>
            <div class="table-wrap">
              <table><tbody>
                <tr><td style="font-weight:600">Total CHF</td><td><strong>${grandTotalChf.toLocaleString('fr-CH')} CHF</strong></td></tr>
                <tr><td style="font-weight:600">Total BRL</td><td>R$ ${grandTotalBrl.toLocaleString('pt-BR')}</td></tr>
                <tr><td style="font-weight:600">BRL → CHF (taux ${rate})</td><td>${brlInChf.toLocaleString('fr-CH', { maximumFractionDigits: 2 })} CHF</td></tr>
                <tr style="background:#EFF6FF"><td style="font-weight:700;color:var(--primary)">GRAND TOTAL</td><td style="font-weight:700;font-size:1.1rem;color:var(--primary)">${grandTotal.toLocaleString('fr-CH', { maximumFractionDigits: 2 })} CHF</td></tr>
              </tbody></table>
            </div>
          </div>`;

        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">⚠️ ${escHtml(err.message)}</div>`;
      }
    }

    loadPayments();
  </script>
</body>
</html>
