<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiements — Voyage Brésil 2026</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
</head>
<body>
  <nav>
    <a class="nav-brand" href="index.html"><span>🇧🇷</span> Voyage Brésil 2026</a>
    <div class="nav-links">
      <a href="index.html">🏠 Accueil</a>
      <a href="flights.html">✈️ Vols</a>
      <a href="lodgings.html">🏨 Hébergements</a>
      <a href="transport.html">🚗 Transport</a>
      <a href="payments.html">💰 Paiements</a>
      <a href="contacts.html">📞 Contacts</a>
      <a href="checklist.html">✅ Checklist</a>
    </div>
    <div class="nav-spacer"></div>
    <a class="nav-admin-link" href="admin.html">⚙️ Admin</a>
  </nav>

  <main>
    <div class="page-header">
      <h1>💰 Paiements par personne</h1>
      <p>Résumé des coûts et statuts de paiement pour chaque voyageur.</p>
    </div>

    <div class="alert alert-info" id="rate-info">
      💱 Taux de change: 1 CHF = <span id="rate-value">6.7</span> BRL
    </div>

    <div id="payments-container">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>
  </main>

  <footer>
    <p>Voyage Brésil 2026 · Données gérées via <a href="https://supabase.com" target="_blank" style="color:rgba(255,255,255,.7)">Supabase</a></p>
  </footer>

  <script src="assets/config.js"></script>
  <script type="module">
    import { fetchPayments, fetchTravellers, showError, showLoading, escHtml, statusBadge } from './assets/public.js';
    import { supabase } from './assets/supabaseClient.js';

    async function loadPayments() {
      const container = document.getElementById('payments-container');
      showLoading(container);

      try {
        const [payments, travellers, { data: params }] = await Promise.all([
          fetchPayments(),
          fetchTravellers(),
          supabase.from('parameters').select('key,value'),
        ]);

        // Update exchange rate display
        const rate = params?.find(p => p.key === 'chf_brl_rate')?.value;
        if (rate) document.getElementById('rate-value').textContent = rate;

        renderPayments(payments, travellers, container);
      } catch (err) {
        showError(container, err.message);
      }
    }

    function renderPayments(payments, travellers, container) {
      if (!payments || !travellers) {
        container.innerHTML = '<div class="alert alert-info">Aucune donnée de paiement.</div>';
        return;
      }

      // Group payments by traveller
      const byTraveller = {};
      payments.forEach(p => {
        const tid = p.traveller_id;
        if (!byTraveller[tid]) byTraveller[tid] = [];
        byTraveller[tid].push(p);
      });

      let html = '';

      travellers.forEach(t => {
        const tPayments = byTraveller[t.id] || [];
        if (tPayments.length === 0) return;

        const totalChf = tPayments.reduce((s, p) => s + (p.price_chf || 0), 0);
        const totalBrl = tPayments.reduce((s, p) => s + (p.price_brl || 0), 0);
        const paidChf = tPayments.filter(p => p.paid?.includes('✅')).reduce((s, p) => s + (p.price_chf || 0), 0);

        html += `
          <div class="card" style="padding:0;overflow:hidden;margin-bottom:1.5rem">
            <div class="payment-person-header">
              <span>👤 ${escHtml(t.name)} <span style="font-weight:400;opacity:.8">— ${escHtml(t.role)}</span></span>
              <span style="font-size:.85rem">
                Total: ${totalChf > 0 ? '<strong>' + totalChf.toLocaleString('fr-CH') + ' CHF</strong>' : ''}
                ${totalBrl > 0 ? ' + R$ ' + totalBrl.toLocaleString('pt-BR') : ''}
              </span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>Catégorie</th><th>Détail</th><th>CHF</th><th>BRL</th><th>Statut</th><th>Notes</th></tr>
                </thead>
                <tbody>
                  ${tPayments.map(p => `<tr>
                    <td><strong>${escHtml(p.category)}</strong></td>
                    <td>${escHtml(p.detail)}</td>
                    <td>${p.price_chf != null ? Number(p.price_chf).toLocaleString('fr-CH') : '—'}</td>
                    <td>${p.price_brl != null ? 'R$ ' + Number(p.price_brl).toLocaleString('pt-BR') : '—'}</td>
                    <td>${statusBadge(p.paid || '—')}</td>
                    <td><small style="color:var(--text-light)">${escHtml(p.notes || '')}</small></td>
                  </tr>`).join('')}
                  <tr class="payment-total-row">
                    <td colspan="2"><strong>SOUS-TOTAL ${escHtml(t.name).toUpperCase()}</strong></td>
                    <td><strong>${totalChf > 0 ? totalChf.toLocaleString('fr-CH') + ' CHF' : '—'}</strong></td>
                    <td><strong>${totalBrl > 0 ? 'R$ ' + totalBrl.toLocaleString('pt-BR') : '—'}</strong></td>
                    <td colspan="2"><small style="color:var(--success)">Payé CHF: ${paidChf.toLocaleString('fr-CH')}</small></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>`;
      });

      // Grand total
      const grandTotalChf = payments.reduce((s, p) => s + (p.price_chf || 0), 0);
      const grandTotalBrl = payments.reduce((s, p) => s + (p.price_brl || 0), 0);
      const rateEl = document.getElementById('rate-value');
      const rate = parseFloat(rateEl?.textContent || '6.7');
      const brlInChf = grandTotalBrl / rate;
      const grandTotal = grandTotalChf + brlInChf;

      html += `
        <div class="card" style="border:2px solid var(--primary)">
          <h2>💰 GRAND TOTAL ESTIMÉ</h2>
          <div class="table-wrap">
            <table>
              <tbody>
                <tr>
                  <td style="font-weight:600">Total CHF direct</td>
                  <td><strong>${grandTotalChf.toLocaleString('fr-CH')} CHF</strong></td>
                </tr>
                <tr>
                  <td style="font-weight:600">Total BRL</td>
                  <td>R$ ${grandTotalBrl.toLocaleString('pt-BR')}</td>
                </tr>
                <tr>
                  <td style="font-weight:600">BRL → CHF (1 CHF = ${rate} BRL)</td>
                  <td>${brlInChf.toLocaleString('fr-CH', { maximumFractionDigits: 2 })} CHF</td>
                </tr>
                <tr style="background:#EFF6FF">
                  <td style="font-weight:700;color:var(--primary)">💰 GRAND TOTAL ESTIMÉ</td>
                  <td style="font-weight:700;font-size:1.1rem;color:var(--primary)">${grandTotal.toLocaleString('fr-CH', { maximumFractionDigits: 2 })} CHF</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>`;

      container.innerHTML = html;
    }

    loadPayments();
  </script>
</body>
</html>
