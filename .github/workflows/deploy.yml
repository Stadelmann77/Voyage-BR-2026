name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Cache-busting: append commit SHA to CSS/JS asset URLs
      - name: Add cache-busting version to assets
        run: |
          VERSION="${GITHUB_SHA:0:8}"
          echo "Cache-bust version: $VERSION"
          for f in *.html; do
            # Add ?v=HASH to local CSS and JS references
            sed -i "s|href=\"assets/\([^\"]*\.css\)\"|href=\"assets/\1?v=$VERSION\"|g" "$f"
            sed -i "s|src=\"assets/\([^\"]*\.js\)\"|src=\"assets/\1?v=$VERSION\"|g" "$f"
          done

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
